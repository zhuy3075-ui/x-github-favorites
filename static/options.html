<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Favorites 设置</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>Favorites 设置</h1><p class="muted">首次连接后，在 X 帖子旁点击一次 ＋ 即可收藏。</p><form id="connection"><h2>连接 Favorites</h2><label for="base-url" class="form-label">多维表格链接</label><input id="base-url" type="url" required autocomplete="off"><label for="credential" class="form-label">本表授权码</label><div class="credential-row"><input id="credential" type="password" autocomplete="off" spellcheck="false" placeholder="pt- 开头的多维表格授权码"><button id="show-token" type="button">显示</button></div><p class="muted">授权码仅保存在这台浏览器，用于连接你的表格。本机存储不等同于加密保险箱；不上传到其他服务器或同步 Chrome 账号。</p><p class="muted">在多维表格的开发／插件相关入口取得本表授权码。CLI 登录不会代替它。</p><label for="table" class="form-label">数据表</label><select id="table"><option value="">根据链接定位或检查后选择</option></select><div class="actions"><button id="check" type="button">检查连接与诊断</button></div><p id="feedback" role="status" aria-live="polite"></p><h2>字段映射</h2><p class="muted">自动推荐同名字段。不匹配时选择对应列；引用和精确时间允许读不到，但需要保留列。</p><div id="mappings"></div><div class="actions"><button id="save" class="primary" type="submit" disabled>保存设置</button></div></form></main><script type="module" src="options.js"></script></body></html>
